<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">天霧澪 オフィシャルサイト ロゴ</title>
  <desc id="desc">天霧澪の名前と英文表記を組み合わせた、背景なしのロゴ。</desc>
  <defs>
    <linearGradient id="logoGlow" x1="116" y1="24" x2="702" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A173FF"/>
      <stop offset="0.58" stop-color="#7B5AE6"/>
      <stop offset="1" stop-color="#E3A0D2"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="900" height="220" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8A73D8" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g opacity="0.9">
    <circle cx="22" cy="43" r="5" fill="#F7B9E4"/>
    <circle cx="840" cy="136" r="6" fill="#B6A7FF"/>
    <path d="M54 42H180" stroke="#C6B8F4" stroke-width="2" stroke-linecap="round"/>
    <path d="M722 136H820" stroke="#C6B8F4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g filter="url(#softShadow)">
    <text x="86" y="92" fill="url(#logoGlow)" font-size="96" font-weight="700" letter-spacing="8" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif">天霧 澪</text>
  </g>
  <text x="88" y="136" fill="#7D55E8" font-size="24" font-weight="700" letter-spacing="6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AMAGIRI MIO OFFICIAL SITE</text>
  <text x="88" y="172" fill="#8B80A9" font-size="18" font-weight="500" letter-spacing="3.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Quiet daylight. Subtle nocturne. Tokyo observation archive.</text>
</svg>
